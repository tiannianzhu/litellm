global:
  resolve_timeout: 5m

route:
  receiver: feishu
  group_by: [alertname, severity, component, service, litellm_model_name, model_id, host, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - receiver: feishu
      matchers:
        - severity="critical"
      group_interval: 5m
      repeat_interval: 2h

receivers:
  - name: feishu
    webhook_configs:
      - url: http://feishu-alert-webhook:5001/alert
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="LiteLLMProxyDown"
    target_matchers:
      - alertname=~"LiteLLMDeploymentUnhealthy|LiteLLMDeploymentFailures"

  - source_matchers:
      - alertname="LiteLLMDeploymentUnhealthy"
    target_matchers:
      - alertname="LiteLLMDeploymentFailures"
    equal: [model_id, api_base]

  - source_matchers:
      - alertname="VLLMTargetDown"
    target_matchers:
      - alertname=~"VLLMEngineStalled|VLLMRouterNoWorkers|VLLMQueueBacklog|VLLMAuxQueueBacklog"
    equal: [instance, service]

  - source_matchers:
      - alertname=~"VLLMEngineStalled|VLLMRouterNoWorkers"
    target_matchers:
      - alertname=~"VLLMQueueBacklog|VLLMAuxQueueBacklog"
    equal: [instance, service]
